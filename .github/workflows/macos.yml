name: Companion and iOS compatibility

on:
  push:
    branches: [main]
    # Feed publication and release notes use the separate Pages workflow.
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'verification/VALIDATION.md'
      - 'verification/ios-design-preservation-report.json'
  pull_request:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} tests and Release build
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # XCTest must forward this for tests that invoke xcodebuild themselves.
      TEST_RUNNER_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and check hygiene
        run: |
          xcodegen generate
          python3 scripts/verify-ios-unchanged.py
          git diff --check
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: macOS backend and companion UI tests
        if: matrix.platform == 'macOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme VampCompanion
          -destination 'platform=macOS' -jobs 2 -derivedDataPath "$RUNNER_TEMP/Derived"
          -resultBundlePath "$RUNNER_TEMP/Tests.xcresult"
          -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO ONLY_ACTIVE_ARCH=YES
          test
      - name: iOS simulator tests
        if: matrix.platform == 'iOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme BeetCodeRemoteIOS
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath "$RUNNER_TEMP/Derived" -resultBundlePath "$RUNNER_TEMP/Tests.xcresult"
          -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" test
      - name: macOS Release build
        if: matrix.platform == 'macOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme VampCompanion -configuration Release
          -destination 'generic/platform=macOS' ARCHS=arm64 EXCLUDED_ARCHS=x86_64 -derivedDataPath "$RUNNER_TEMP/Derived"
          -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: iOS device Release build
        if: matrix.platform == 'iOS'
        run: >-
          xcodebuild -project BeetCode.xcodeproj -scheme BeetCodeRemoteIOS -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Derived"
          -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-test-results
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 7
